[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cmcu-bsq-calibration"
version = "0.1.0"
description = "Task103 CMCU calibration and auditable quality filters"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.12"]

[project.optional-dependencies]
mcap = ["mcap>=1.2", "protobuf>=4.25", "zstandard", "lz4"]

[project.scripts]
cmcu-calibrate = "cmcu_calibration.pipeline:main"

[tool.setuptools.packages.find]
include = ["cmcu_calibration*"]
